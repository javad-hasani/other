name: V2Ray-500 capacity guard

on:
  push:
    paths:
      - "v2ray-500/db/**"
      - "v2ray-500/tests/**"
      - "v2ray-500/scripts/**"
      - "v2ray-500/config/upstream.lock"
      - "v2ray-500/config/lab.env.example"
      - "v2ray-500/docker-compose.lab.yml"
      - ".github/workflows/v2ray500-capacity-ci.yml"
  pull_request:
    paths:
      - "v2ray-500/db/**"
      - "v2ray-500/tests/**"
      - "v2ray-500/scripts/**"
      - "v2ray-500/config/upstream.lock"
      - "v2ray-500/config/lab.env.example"
      - "v2ray-500/docker-compose.lab.yml"
      - ".github/workflows/v2ray500-capacity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: provisioning_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d provisioning_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci_only_disposable_password@localhost:5432/provisioning_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Offline preflight / pinned source integrity
        run: bash v2ray-500/scripts/preflight.sh
      - name: Validate local Docker Compose (no container launched)
        env:
          LAB_DB_USER: lab_ci
          LAB_DB_NAME: lab_ci
          LAB_DB_PASSWORD: disposable_ci_config_only
        run: docker compose -f v2ray-500/docker-compose.lab.yml config --quiet
      - name: Verify 500-seat reservation, idempotency, and race safety
        run: python v2ray-500/tests/test_capacity.py
